  else state.hunger = Math.min(100, state.hunger + h);
}
function eat() {
  if (!state.snacks.length) { toast('No snacks. The fridge is at the dock.', '#ffb347'); return sfx.no(); }
  const f = DATA.food.find(x => x.id === state.snacks.shift()); applyFood(f); toast('Ate: ' + f.name); sfx.crunch();
}
function tickMeters(dt) {
  if (state.phase === 'hunger') { state.hunger -= tune.hunger_drain * dt; if (state.hunger <= 0) { state.hunger = 0; state.phase = 'munchies'; state.munchies = 0; toast('Here come the Munchies.', '#ffb347'); } }
  else if (state.munchies < 100) { state.munchies = Math.min(100, state.munchies + tune.munchies_fill * dt); if (state.munchies >= 100) { toast('MUNCHIES MAXED. No fishing, no smoking, till you eat.', '#ff6a5a'); sfx.no(); } }
  if (state.yak > 0) { state.yak -= dt; state.chill = 100; if (state.yak <= 0) state.hold = 0; }
  else if (state.hold > 0) state.hold -= dt;
  else if (state.chill > 0) { state.chill -= tune.chill_drain * dt; if (state.chill <= 0) { state.chill = 0; state.strain = null; toast('Sober again.'); } }
  state.clock += dt; if (state.clock >= tune.day_seconds + tune.night_seconds) { state.clock = 0; state.day++; }
  for (const t of state.toasts) t.t -= dt; state.toasts = state.toasts.filter(t => t.t > 0);
  if (state.banner) { state.banner.t -= dt; if (state.banner.t <= 0) state.banner = null; }
  for (const p of state.puffs) p.t += dt; state.puffs = state.puffs.filter(p => p.t < 2.2);
  state.rainbow = Math.max(0, state.rainbow - dt); state.buzz = Math.max(0, state.buzz - dt);
  state.score = Math.round(state.cash);
}
function movePlayer(dt) {
  const turn = (down.has('KeyD') || down.has('ArrowRight') ? 1 : 0) - (down.has('KeyA') || down.has('ArrowLeft') ? 1 : 0);
  state.yaw -= turn * tune.turn_rate * dt;
  state.pitch = clamp(state.pitch + ((down.has('ArrowUp') ? 1 : 0) - (down.has('ArrowDown') ? 1 : 0)) * dt, -0.7, 0.5);
  const free = state.cast.mode === 'idle' || state.cast.mode === 'done'; // the line is out: the kayak holds still
  const go = free ? (down.has('KeyW') ? 1 : 0) - (down.has('KeyS') ? 0.6 : 0) : 0;
  const fx = -Math.sin(state.yaw), fz = -Math.cos(state.yaw);
  state.vx += fx * go * tune.paddle_accel * dt; state.vz += fz * go * tune.paddle_accel * dt;
  const drag = Math.exp(-tune.paddle_drag * (free ? 1 : 4) * dt); state.vx *= drag; state.vz *= drag;
  const sp = Math.hypot(state.vx, state.vz); if (sp > tune.paddle_max) { state.vx *= tune.paddle_max / sp; state.vz *= tune.paddle_max / sp; }
  state.px += state.vx * dt; state.pz += state.vz * dt; state.speed = Math.min(sp, tune.paddle_max);
  const r = Math.hypot(state.px, state.pz), lim = shoreR(Math.atan2(state.pz, state.px)) - 1.4;
  if (r > lim) { state.px *= lim / r; state.pz *= lim / r; state.vx *= 0.3; state.vz *= 0.3; } // the bank stops the kayak
}

// ---- The dock, the phone and the Map ------------------------------------------------------
function closeMenu() { state.menu = null; state.phoneAnim = 0; }
function say(s) { if (state.menu) state.menu.msg = s; }
function dropBox() { // both ways: fish in for Jimmy, cash and deliveries out
  const n = state.fish.length, out = [];

  if (state.boxCash > 0) { state.cash += state.boxCash; out.push(`Collected ${money(state.boxCash)} from Jimmy.`); state.boxCash = 0; sfx.cash(); }
  if (state.boxGoods.length) { for (const g of state.boxGoods) { state.stash[g.id] = (state.stash[g.id] || 0) + g.g; if (!state.sel) state.sel = g.id; } out.push(`Picked up ${state.boxGoods.length} from The Guy.`); state.boxGoods = []; sfx.ok(); }
  say(out.length ? out.join(' ') : 'Nothing to drop, nothing waiting.'); if (n && out.length === 1) sfx.ok();
}
function startSleep() { closeMenu(); state.sleep = 2.4; state.sleptApplied = false; sfx.sleep(); }
function tickSleep(dt) {
  state.sleep -= dt;
  if (!state.sleptApplied && state.sleep < 1.2) { // morning: Jimmy has paid, The Guy has delivered, the fridge is restocked
    state.sleptApplied = true; state.day++; state.clock = 0.02 * tune.day_seconds;
    let pay = 0; for (const it of state.box) { pay += it.value; if (it.kind === 'fish') state.log[it.f.id].sold++; }
    const n = state.box.length; state.box = []; state.boxCash += pay;
    const goods = state.orders.length; state.boxGoods.push(...state.orders); state.orders = [];
    state.fridge = [...DATA.fridgeDaily]; state.chill = 0; state.strain = null; state.yak = 0; state.yakBonus = false; state.hold = 0;
    if (state.phase === 'hunger') state.hunger = Math.max(12, state.hunger - 20); else state.munchies = Math.min(100, state.munchies + 12);
    state.cast = { mode: 'idle' }; toast(`Day ${state.day}.`);
    if (n) toast(`Jimmy left ${money(pay)} in The Drop Box for ${n}.`, '#9fe870');
    if (goods) toast("The Guy's delivery is in The Drop Box.", '#9fe870');
  }
  if (state.sleep <= 0) state.sleep = 0;
}
function fridge() {
  if (!state.fridge.length) return say('The fridge is empty till morning.');

const h1 = i => { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }; // fixed scatter for markings (look only)

  if (a.pat === 'stripe') { g.fillStyle = dark; g.beginPath(); g.moveTo(nose + L * 0.15, cy - Hh * 0.05); for (let i = 0; i <= 12; i++) g.lineTo(nose + L * (0.15 + i * 0.055), cy + Hh * (i % 2 ? -0.24 : -0.02)); for (let i = 12; i >= 0; i--) g.lineTo(nose + L * (0.15 + i * 0.055), cy + Hh * (i % 2 ? 0.02 : 0.22)); g.closePath(); g.fill(); }

function view3D(o) {
  if (!G) { clear('#27485a'); txt('3D could not start in this browser.', W / 2, H / 2, 22, '#ffffff'); return; }
  G.render(o);
}
const scenes = {
  figures: { // every fish and every piece of junk, side by side, named
    update(dt) { state.t += dt; },
    draw() {
      clear('#16303c'); txt("LIL' PUFFIN' POND  -  the catch", W / 2, 34, 28, '#ffe27a', 'center', HEAD, false);
      const items = [...DATA.fish.map(f => ({ kind: 'fish', f, name: f.short, rarity: f.rarity })), ...DATA.junk.map(j => ({ kind: 'junk', j, name: j.name, rarity: -1 }))];
      items.forEach((it, i) => {
        const x = 128 + (i % 5) * 256, y = 132 + Math.floor(i / 5) * 218;
        ctx.fillStyle = '#5d8fa3'; ctx.fillRect(x - 112, y - 66, 224, 132);
        drawItem(ctx, it, x, y, it.kind === 'junk' ? 0.9 : Math.min(1.25, 1.12 / it.f.art.L));
        txt(it.name, x, y + 84, 17, '#ffffff'); txt(it.rarity < 0 ? 'Junk' : DATA.rarities[it.rarity], x, y + 106, 15, it.rarity < 0 ? '#b8c0c8' : DATA.rarityColors[it.rarity]);
      });
    },
  },
  title: {
    update(dt) { state.t += dt; if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; sfx.ok(); } },
    draw() {
      const a = state.t * 0.05 + 1.2;
      view3D({ x: Math.cos(a) * 26, z: Math.sin(a) * 26 + 6, yaw: a + Math.PI / 2 + 0.5, pitch: -0.02, clock: tune.day_seconds * 0.9, t: state.t, speed: 0, cast: null });
      ctx.fillStyle = 'rgba(8,12,18,0.42)'; ctx.fillRect(0, 0, W, H);
      txt(TITLE, W / 2, 150, 124, '#ffb347', 'center', HEAD, false, 12);
      txt('High Times = High Tips', W / 2, 238, 30, '#ffe27a', 'center', FONT, true, 5);
      panel(250, 300, 780, 220);
      CONTROLS.forEach((c, i) => txt(c, W / 2, 338 + i * 34, 19, '#ffffff'));
      txt("Lil' Puffin' Pond sketch: fish as long as you like.", W / 2, 488, 17, '#e4dcb8');
      if (Math.floor(state.t * 2) % 2 === 0) txt('ENTER: New Sesh', W / 2, 590, 40, '#ffffff', 'center', HEAD, false, 7);
    },
  },
  play: {
    update(dt) {
      if (state.sleep > 0) { tickSleep(dt); return; }
      if (state.menu) { tickMenu(); return; } // the world waits while the phone or the dock is open
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      state.t += dt;
      if (pressed('Tab')) { state.menu = phoneRoot(); state.phoneAnim = 0; sfx.flip(); return; }
      if (pressed('KeyE') && nearDock() && (state.cast.mode === 'idle' || state.cast.mode === 'done')) { state.menu = dockMenu(); sfx.blip(); return; }
      movePlayer(dt); tickCast(dt); tickMeters(dt);
      if (pressed('KeyF')) smoke(); if (pressed('KeyQ')) nextStrain(); if (pressed('KeyR')) eat();
    },
    draw() {
      view3D({ x: state.px, z: state.pz, yaw: state.yaw, pitch: state.pitch, clock: state.clock, t: state.t, speed: state.speed / tune.paddle_max, cast: state.cast, sat: vibrance(), blur: state.yak > 0 ? 2.2 + Math.sin(state.t * 2) * 0.8 : 0 });
      drawHUD();
      const m = state.menu; if (m) { if (m.kind === 'phone') drawPhone(m); else if (m.kind === 'dock') drawDock(m); else drawMap(m); }
      if (state.sleep > 0) { ctx.globalAlpha = state.sleep > 1.2 ? (2.4 - state.sleep) / 1.2 : state.sleep / 1.2; clear('#000'); ctx.globalAlpha = 1; if (state.sleep < 1.9 && state.sleep > 0.5) txt(`DAY ${state.sleptApplied ? state.day : state.day + 1}`, W / 2, H / 2, 64, '#ffe27a', 'center', HEAD, false); }
    },
  },
  pause: {
    update() {
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      if (pressed('KeyR')) { reset(); scene = 'play'; }
      if (pressed('KeyL')) state.debug = !state.debug;
    },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H); panel(340, 190, 600, 330);
      txt('PAUSED', W / 2, 240, 56, '#ffe27a', 'center', HEAD, false);
      txt(state.gained || 'No fish logged yet', W / 2, 300, 20, '#ffffff');
      txt('P: back to the pond', W / 2, 350, 20, '#ffffff'); txt('R: start over (clears this session)', W / 2, 384, 20, '#ffffff'); txt('M: mute', W / 2, 418, 20, '#ffffff');
      txt(`L: Lost Legend debug is ${state.debug ? 'ON' : 'OFF'}`, W / 2, 468, 18, state.debug ? '#ff7ad9' : '#b8c0c8');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
