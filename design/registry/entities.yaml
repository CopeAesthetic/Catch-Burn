#       can absorb all damage). Max is uncapped in formula but tuning knob
#       damage_cap in combat.md clamps at 999."
#     added: 2026-03-26
#     revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: entries_per_pond
    status: active
    source: design/gdd/fish-database-spawn-tables.md
    referenced_by:
      - design/gdd/fish-database-spawn-tables.md
    value: 10
    unit: fish
    notes: "3 Common, 2 Uncommon, 2 Rare, 1 Epic, 1 Legendary, 1 Lost Legend. 320 entries over 32 ponds. A pond entry is the unit the game counts (owner decision 2026-11-16)."
    added: 2026-11-16
    revised: ""

  - name: non_legend_entries_per_pond
    status: active
    source: design/gdd/fish-database-spawn-tables.md
    referenced_by:
      - design/gdd/fish-database-spawn-tables.md
    value: 9
    unit: fish
    notes: "What must be caught to buy the next pond; 36 per area opens the next area and that area's Lost Legends."
    added: 2026-11-16
    revised: ""

  - name: junk_chance
    status: active
    source: design/gdd/fish-database-spawn-tables.md
    referenced_by:
      - design/gdd/fish-database-spawn-tables.md
    value: 0.4
    unit: probability
    notes: "Sober, once the pond's three Commons are logged. Capped at 0.8. Starting value, untuned."
    added: 2026-11-16
    revised: ""

  - name: new_entry_bias
    status: active
    source: design/gdd/fish-database-spawn-tables.md
    referenced_by:
      - design/gdd/fish-database-spawn-tables.md
    value: 2
    unit: multiplier
    notes: "An unlogged entry is this much likelier within its rarity (owner decision 2026-11-16)."
    added: 2026-11-16
    revised: ""

  - name: state_bonus
    status: active
    source: design/gdd/fish-database-spawn-tables.md
    referenced_by:
      - design/gdd/fish-database-spawn-tables.md
    value: 0.3
    unit: per Chill state
    notes: "Extra weight for boosted rarities per Chill state above the first. Floor 0.05. Starting value, untuned."
    added: 2026-11-16
    revised: ""

  - name: trophy_band
    status: active
    source: design/gdd/fish-database-spawn-tables.md
    referenced_by:
      - design/gdd/fish-database-spawn-tables.md
    value: 0.05
    unit: share of weight range
    notes: "A catch in the top share of its range is a trophy (owner decision 2026-11-16: by weight alone)."
    added: 2026-11-16
    revised: ""

  - name: lure_bias_cap
    status: active
    source: design/gdd/fish-database-spawn-tables.md
    referenced_by:
      - design/gdd/fish-database-spawn-tables.md
      - design/gdd/gear-item-database.md
    value: 3
    unit: multiplier
    notes: "The most a lure may multiply an entry's pick weight. Gear and Item Database owns the per-lure sizes under this cap."
    added: 2026-11-16
    revised: ""

  - name: pct_floor
    status: active
    source: design/gdd/gear-item-database.md
    referenced_by:
      - design/gdd/gear-item-database.md
    value: -0.5
    unit: summed percent
    notes: "Lowest the summed percent modifiers on one stat may reach: no gear combination more than halves a stat (owner decision 2026-11-16). Data range -0.9 to 0."
    added: 2026-11-16
    revised: ""

  - name: pct_cap
    status: active
    source: design/gdd/gear-item-database.md
    referenced_by:
      - design/gdd/gear-item-database.md
    value: 1.0
    unit: summed percent
    notes: "Highest the summed percent modifiers on one stat may reach: no gear combination more than doubles a stat (owner decision 2026-11-16). Data range 0 to 3."
    added: 2026-11-16
    revised: ""

  - name: gas_mask_factor
    status: active
    source: design/gdd/gear-item-database.md
    referenced_by:
      - design/gdd/gear-item-database.md
    value: 2
    unit: multiplier
    notes: "The Gas Mask doubles both chill_per_hit and grams_per_hit of the equipped smoking item (brief, Smoking section). Chill Meter and Smoking owns each strain's base."
    added: 2026-11-16
    revised: ""

