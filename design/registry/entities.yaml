# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
#             economy-designer, systems-designer (new cross-system entries,
#               after asking)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /design-review (Phase 1 — cross-doc facts, in place of sibling GDDs)
#             /content-audit (Step 2 — planned named-content count)
#             /balance-check (Phase 3 — intended constant/formula values)
#             /propagate-design-change (Step 3 — downstream GDD impact via referenced_by)
#             /asset-spec (named entities to write specs for)
#             economy-designer, systems-designer (before authoring items,
#               loot tables and formulas)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="design/gdd/inventory.md" -B 8
#                            (referenced_by is a block list, so match the
#                            path; referenced_by.*inventory never matches)
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. Each section is a
#   key at column 0 holding a block list, or [] while it is empty. Each entry
#   starts "- name: <name>" with the dash at column 2 (or 0, the same for every
#   entry of a section); its fields sit two columns past the dash, and a deeper
#   line belongs to the field above it. Quote a value that holds ": ". A line
#   in any other shape is reported as unsupported layout, with its number.

version: 1
last_updated: "2026-11-17"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: rarity_chance
    status: active
    source: design/gdd/fish-database-spawn-tables.md
    referenced_by:
      - design/gdd/fish-database-spawn-tables.md
    variables:
      - base_weight
      - state_bonus
      - chill_state
      - tier
    output_range: [0, 1]
    expression: "effective_weight(r) / sum(effective_weight); chill_mult = 1 + state_bonus * (chill_state - 1); effective_weight = base_weight[tier][r] * (chill_mult if boosted) * (chill_mult if r has an unlogged entry)"
    notes: "Which rarity bites under a strain tier. chill_state comes from Chill Meter and Smoking, tier from Strains and Unlock Chain, the logged set from Fishing Log via Bite Timing. Starting values are the browser sketch's, untuned. With an empty or complete log the missing term cancels."
    added: 2026-11-16
    revised: "2026-11-16: missing-rarity term added (owner decision; higher Chill now fills the log faster)"

  - name: entry_chance
    status: active
    source: design/gdd/fish-database-spawn-tables.md
    referenced_by:
      - design/gdd/fish-database-spawn-tables.md
    variables:
      - new_entry_bias
      - lure_bias
      - lure_bias_cap
    output_range: [0, 1]
    expression: "pick_weight(e) / sum(pick_weight); pick_weight = (new_entry_bias if unlogged else 1) * lure_bias(e)"
    notes: "Which entry of the chosen rarity bites. lure_bias comes from Gear and Item Database and is clamped to 1..lure_bias_cap. It never opens a rarity."
    added: 2026-11-16
    revised: ""

  - name: catch_weight
    status: active
    source: design/gdd/fish-database-spawn-tables.md
    referenced_by:
      - design/gdd/fish-database-spawn-tables.md
    variables:
      - weight_min
      - weight_max
      - weight_skew
      - trophy_band
    output_range: [0, 1]
    expression: "weight_fraction = u ^ weight_skew; weight = weight_min + (weight_max - weight_min) * weight_fraction; is_trophy = weight_fraction >= 1 - trophy_band"
    notes: "Output is weight_fraction, 0 to under 1. Economy prices a catch from it; the trophy flag also goes to Reel-in Needle and the HUD. Trophy rate at starting values is about 3.2 percent."
    added: 2026-11-16
    revised: ""

  - name: stat_value
    status: active
    source: design/gdd/gear-item-database.md
    referenced_by:
      - design/gdd/gear-item-database.md
      - design/gdd/player-controller.md
    variables:
      - base
      - flat
      - flat_max
      - percent
      - pct_floor
      - pct_cap
      - factor
    output_range: "never below 0; half to twice the base before factors at the starting pct_floor and pct_cap; factors at most x6 with shipped data"  # was: [0, 999] before 2026-11-17 (not in the source GDD)
    expression: "max(0, base + min(sum(flat), flat_max)) * clamp(1 + sum(percent), 1 + pct_floor, 1 + pct_cap) * product(factor)"
    notes: "How gear changes any stat another system owns. Flats add up to a per-key flat_max (stackable flat keys only), percents add (owner decision 2026-11-16), factors (smoking item, mask) multiply. Mask factors apply only with a smoking item equipped. Only the best owned ladder step counts. Each gameplay system supplies its own base. Was: no flat_max (revised by the gear design review, 2026-11-16)."
    added: 2026-11-16
    revised: 2026-11-17

  - name: sun_direction
    status: active
    source: design/gdd/retro-rendering.md
    referenced_by:
      - design/gdd/retro-rendering.md
    variables:
      - time_of_day
      - sunrise_hour
      - night_start_hour
      - sun_elev_min_deg
      - sun_elev_max_deg
      - pond_north_deg
    output_range: [10, 58]
    expression: "p = clamp((t - sunrise_hour) / (night_start_hour - sunrise_hour), 0, 1); azimuth = 90 + 180*p + pond_north_deg; elevation = sun_elev_min_deg + (sun_elev_max_deg - sun_elev_min_deg) * sin(pi*p)"
    notes: "Output range is the sun's elevation in degrees at the defaults (10 at sunrise and sunset, 58 at solar noon); azimuth runs east 90 through south 180 to west 270. A pure function of the host clock, owned by Retro Rendering (owner decision 2026-11-17) and read by Shade Sweet Spots so shade and sun agree on every co-op peer. sunrise_hour (6.0, constant) and night_start_hour come from Day, Night & Sleep Formulas 1 and 2."
    added: 2026-11-17
    revised: 2026-11-17

  - name: shade_gap
    status: active
    source: design/gdd/retro-rendering.md
    referenced_by:
      - design/gdd/retro-rendering.md
    variables:
      - LitWater
      - ShadeWater
      - water_light
      - f_c
      - b
      - m
    output_range: [1, 21]
    expression: "lit = b*m*((1-f_c)*(LitWater*water_light) + f_c*sky_fog_color); shade = same with ShadeWater; C = (Y(lit) + 0.05) / (Y(shade) + 0.05), Y = relative luminance in linear light. f_c = fog at casting range (0 by Formula 4), b = Brightness gain, m = CRT mean darkening in linear light"
    notes: "Contrast ratio between lit and shaded water at casting range (owner decision 2026-11-17: contrast ratio, not plain luminance ratio). Must be >= shade_gap_min whenever Shade Sweet Spots provides shapes, at every region, time of day, Brightness 0.8-1.2, vibrance and CRT state. North East palette gives 3.47 at noon. Vibrance cannot change it (luminance-preserving). m is a linear factor only because the CRT pass darkens in linear light (rule 12, first design review 2026-11-17)."
    added: 2026-11-17
    revised: 2026-11-17

  - name: night_start_hour
    status: active
    source: design/gdd/day-night-sleep.md
    referenced_by:
      - design/gdd/day-night-sleep.md
      - design/gdd/retro-rendering.md
    variables:
      - warn1_lead_s
      - clock_rate
    output_range: [16.5, 22.5]
    expression: "night_start_hour = 24 - warn1_lead_s * clock_rate, clock_rate = (24 - sunrise_hour) / day_length_s"
    notes: "Hour Night begins and the first warning fires (Day, Night & Sleep Formula 2; 21.0 at the defaults day_length_s 1080, warn1_lead_s 180). Shade ends here, Retro Rendering's sun sets here (its Formula 2) and its Sunset light key is fully in (its Formula 3). The load check refuses dawn_end_hour < dusk_start_hour < night_start_hour being out of order. Registered by /consistency-check 2026-11-17."
    added: 2026-11-17
    revised: ""

# Example:
#
# formulas:
#   - name: damage_formula
#     status: active
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/progression.md   # progression GDD scales attack variable
#     variables:
#       - attack
#       - defense
#       - crit_chance
#       - crit_multiplier
#     output_range: [0, 999]
#     expression: "max(0, attack - defense) * (1 + crit_chance * crit_multiplier)"
#     notes: "Output feeds into health-system damage intake. Min is 0 (armour
#       can absorb all damage). Max is uncapped in formula but tuning knob
#       damage_cap in combat.md clamps at 999."
#     added: 2026-03-26
#     revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

